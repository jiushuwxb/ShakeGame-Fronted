<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>希捷极速传输挑战赛大屏</title>
    <link rel="stylesheet" href="./styles.css?v=20260414-countdown1">
  </head>
  <body>
    <main class="screen-shell">
      <section class="screen-hero hidden" id="screenHero">
        <div class="screen-hero-mask"></div>
        <div class="screen-hero-copy">
          <h1 id="title">大容远致智启视听新境</h1>
          <p class="subtitle" id="brandLine">Mass Capacity, Smart Media Future</p>
        </div>

        <div class="screen-hero-center">
          <div class="qrcode-frame">
            <img src="./assets/qrcode.png" alt="扫码参与">
          </div>
        </div>

        <img src="./assets/join.png" alt="扫码参与游戏互动" class="screen-join-image">
      </section>

      <section class="screen-ready hidden" id="screenReady">
        <div class="screen-ready-mask"></div>
        <aside class="screen-ready-side">
          <div class="qrcode-frame ready-qrcode">
            <img src="./assets/qrcode.png" alt="扫码参与">
          </div>
          <img src="./assets/join.png" alt="扫码参与游戏互动" class="screen-join-image ready-join-image">
        </aside>

        <div class="screen-ready-main">
          <div class="screen-ready-count">
            <span>当前在线人数</span>
            <strong id="readyTotal">10</strong>
          </div>

          <div class="screen-ready-grid" id="readyPlayers"></div>

          <button class="screen-ready-button" id="readyStart" type="button">
            <img src="./assets/button.png" alt="开始游戏">
          </button>
        </div>
      </section>

      <section class="screen-countdown hidden" id="screenCountdown">
        <div class="screen-live-mask"></div>
        <div class="screen-countdown-inner">
          <div class="screen-countdown-value" id="screenCountdownValue">3</div>
          <img src="./assets/line.png" alt="" class="screen-countdown-line">
        </div>
      </section>

      <section class="screen-live hidden" id="screenLive">
        <div class="screen-live-mask"></div>
        <div class="screen-live-timer">
          <img src="./assets/shalou.png" alt="倒计时" class="screen-live-timer-icon">
          <strong id="liveTimer">00:59</strong>
        </div>

        <div class="screen-live-center">
          <img src="./assets/data.png" alt="数据传输赛道" class="screen-live-title-image">
          <img src="./assets/ironwolf.png" alt="IRONWOLF PRO" class="screen-live-subtitle-image">
        </div>

        <section class="screen-live-race" id="liveLeaderboard"></section>

        <aside class="screen-live-admin hidden">
          <span class="pill" id="liveStatus">连接中</span>
          <strong>参与玩家 <span id="liveTotal">0</span></strong>
          <input id="liveAdminToken" type="password" placeholder="管理口令">
          <div class="stack">
            <button id="liveStart" type="button">开始比赛</button>
            <button class="secondary" id="liveEnd" type="button">手动结束</button>
            <button class="danger" id="liveReset" type="button">重置活动</button>
          </div>
        </aside>
      </section>

      <section class="screen-end hidden" id="screenEnd">
        <div class="screen-live-mask"></div>
        <div class="screen-end-inner">
          <img src="./assets/win.png" alt="获奖名单" class="screen-end-title-image">
          <img src="./assets/ironwolf.png" alt="IRONWOLF PRO" class="screen-end-subtitle-image">
          <section class="screen-end-grid" id="endLeaderboard"></section>
          <button class="screen-end-reset-button" id="endReset" type="button">重置活动</button>
        </div>
      </section>
    </main>
    <script src="./config.js?v=20260414-countdown1"></script>
    <script src="./screen.js?v=20260414-countdown1"></script>
  </body>
</html>
